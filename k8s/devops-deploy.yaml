apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-backend
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devops-backend
  template:
    metadata:
      labels:
        app: devops-backend
    spec:
      containers:
        - name: devops-backend
          image: harbor.peppa-pig.top:8443/argo-workflow/devops-backend:latest
          ports:
            - containerPort: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: devops-backend
  namespace: default
spec:
  type: NodePort
  selector: { app: devops-backend }
  ports:
    - port: 8081
      targetPort: 8081
